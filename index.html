<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ezoognósia dos Bovinos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>🐄 Ezoognósia dos Bovinos</h1>
            <p>Quiz de Descrição Zootécnica</p>
        </header>
<section class="jogador">

    <label for="nomeJogador">
        👤 Nome do jogador
    </label>

    <div class="jogador-controle">

        <input
            type="text"
            id="nomeJogador"
            placeholder="Digite seu nome"
            maxlength="20"
        >

        <button id="btnSalvarNome">
            Jogar
        </button>

    </div>

</section>

<section class="ranking">

    <button id="btnRanking">
        🏆 Ver Ranking
    </button>

</section>
        <!-- ESCOLHA DO ANIMAL -->
        <section class="selecao-animal">

            <h2>Escolha o modo de estudo</h2>

            <div class="botoes-animal">

    <button id="btnMacho">
        🐂 Macho
    </button>

    <button id="btnFemea">
        🐄 Fêmea
    </button>

    <button id="btnAleatorio">
        🔀 Aleatório
    </button>

    <button id="btnDefinicao">
        📖 Definição → Estrutura
    </button>

</div>

        </section>

        <!-- PLACAR -->
        <section class="placar">

    <div>
        ⭐ Pontos:
        <span id="pontos">0</span>
    </div>

    <div>
        ❤️ Vidas:
        <span id="vidas">2</span>
    </div>

    <div>
        🔥 Combo:
        <span id="combo">0</span>
    </div>

    <div>
        🏆 Nível:
        <span id="nivel">1</span>
    </div>

</section>
        <!-- IMAGEM -->
        <section class="imagem-area">

            <img
                id="animal"
                src="imagens/boi_numerado.png"
                alt="Bovino com regiões zootécnicas numeradas">

        </section>

        <!-- PERGUNTA -->
        <section class="pergunta-area">

            <h2 id="pergunta">
                Escolha Macho, Fêmea ou Aleatório para começar.
            </h2>

            <div id="alternativas"></div>

        </section>

        <!-- MENSAGEM -->
        <section class="mensagem-area">

            <div id="mensagem"></div>

            <button id="proxima">
                Próxima pergunta →
            </button>

        </section>
<div id="rankingModal" class="modal">

    <div class="modal-conteudo">

        <button id="fecharRanking" class="fechar">
            ✕
        </button>

        <h2>🏆 Ranking</h2>

        <ol id="listaRanking"></ol>

    </div>

</div>
    </main>

    <script src="perguntas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    

</body>

</html>
